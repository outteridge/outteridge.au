<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Peter O</title>
    <link rel="stylesheet" href="./css/style.css">
    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>
</head>

<body>

<main>

    <h1>Contact</h1>

    <p>
        Please use the form below to send me a message.
    </p>

    <form id="contactForm">

        <div class="form-group">
            <label for="name">Name</label>
            <input
                type="text"
                id="name"
                name="name"
                required>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required>
        </div>

        <div class="form-group">
            <label for="message">Message</label>
            <textarea
                id="message"
                name="message"
                required></textarea>
        </div>

        <!-- Honeypot -->
        <input
            type="text"
            name="website"
            tabindex="-1"
            autocomplete="off"
            style="display:none;">

        <!-- Turnstile -->
        <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAELkcnQ5ZDXsJKoJ">
        </div>

        <p>
            <button type="submit">
                Send Message
            </button>
        </p>

    </form>

    <p>
        <a href="index.html">← Return to Home Page</a>
    </p>

</main>

<footer>
    © 2026 Peter Outteridge. All rights reserved.
</footer>

<script>
document.getElementById('contactForm').addEventListener(
    'submit',
    async function (e) {

        e.preventDefault();

        const turnstileToken = document.querySelector(
            '[name="cf-turnstile-response"]'
        )?.value;

        if (!turnstileToken) {
            alert('Please complete the verification check.');
            return;
        }

        try {

           const response = await fetch(
                'https://contact-form.peter-outteridge.workers.dev',
                {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        name: this.name.value,
                        email: this.email.value,
                        message: this.message.value,
                        website: this.website.value,
                        turnstileToken: turnstileToken
                    })
                }
            );

            if (response.ok) {
                window.location.href =
                    'contact-success.html';
            } else {
                alert(
                    'There was a problem sending your message.'
                );
            }

        } catch (error) {

            console.error(error);

            alert(
                'There was a problem contacting the server.'
            );
        }
    }
);
</script>

</body>
</html>
